name: Update War League

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/calendar.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write   # commit new snapshots
  pages: write
  id-token: write

concurrency:
  group: warleague
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the ingest script
        run: python3 -m unittest discover -s scripts

      - name: Fetch the latest capture and store it if new
        env:
          LEAGUE_FEED_URL: ${{ secrets.LEAGUE_FEED_URL }}
        run: |
          if [ -n "$LEAGUE_FEED_URL" ]; then
            # A failed fetch leaves the stored data untouched.
            curl --fail --location --silent --show-error --retry 3 --max-time 45 \
              "$LEAGUE_FEED_URL" --output "$RUNNER_TEMP/feed.json" || echo '{}' > "$RUNNER_TEMP/feed.json"
          else
            echo '{}' > "$RUNNER_TEMP/feed.json"
          fi
          python3 scripts/ingest.py "$RUNNER_TEMP/feed.json"

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new snapshot."
          else
            git commit -m "New War League snapshot"
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp data/league.json _site/league.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
